name: icecream_mobile
description: Scooply — POS for ice cream shops
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  esc_pos_utils_plus: ^2.0.4
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.1.2
  print_bluetooth_thermal: ^1.2.2
  printing: ^5.14.2
  shared_preferences: ^2.5.3
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  flutter_secure_storage: ^10.0.0
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/launcher.png
  adaptive_icon_background: "#C8ECFF"
  adaptive_icon_foreground: assets/brand/launcher.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/brand/launcher.png
    background_color: "#C8ECFF"
    theme_color: "#2F6FED"
  windows:
    generate: true
    image_path: assets/brand/launcher.png
  macos:
    generate: true
    image_path: assets/brand/launcher.png
